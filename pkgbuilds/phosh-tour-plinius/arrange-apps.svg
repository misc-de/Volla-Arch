<svg xmlns="http://www.w3.org/2000/svg" width="240" height="400" viewBox="0 0 240 400">
  <!-- Hold a running app for a second, then move it in the order (phosh-plinius 0076) -->
  <path d="M30 10a15 15 0 0 0-15 15v375h210V25a15 15 0 0 0-15-15z" fill="#deddda" fill-opacity=".92"/>
  <rect x="105" y="17" width="30" height="5" rx="2.5" fill="#fff" fill-opacity=".92"/>
  <rect x="20" y="30" width="200" height="370" fill="#000"/>
  <rect x="30" y="37" width="20" height="6" rx="3" fill="#fff" fill-opacity=".7"/>
  <rect x="196" y="37" width="14" height="6" rx="2" fill="#fff" fill-opacity=".7"/>
  <!-- the running apps above the app grid: the first place is free -->
  <rect x="31" y="59" width="50" height="94" rx="5" fill="none" stroke="#f6f5f4" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="95" y="58" width="52" height="96" rx="5" fill="#f6f5f4"/>
  <rect x="95" y="58" width="52" height="12" rx="5" fill="#deddda"/>
  <rect x="161" y="58" width="52" height="96" rx="5" fill="#f6f5f4"/>
  <rect x="161" y="58" width="52" height="12" rx="5" fill="#deddda"/>
  <g fill="#c0bfbc">
    <rect x="101" y="78" width="40" height="5" rx="2.5"/><rect x="101" y="89" width="30" height="5" rx="2.5"/><rect x="101" y="100" width="36" height="5" rx="2.5"/>
    <rect x="167" y="78" width="34" height="5" rx="2.5"/><rect x="167" y="89" width="40" height="5" rx="2.5"/>
  </g>
  <circle cx="121" cy="166" r="7" fill="#f6f5f4" fill-opacity=".5"/>
  <circle cx="187" cy="166" r="7" fill="#f6f5f4" fill-opacity=".5"/>
  <!-- the app grid -->
  <g fill="#f6f5f4" fill-opacity=".2">
    <rect x="30" y="190" width="180" height="25" rx="12.5"/>
    <circle cx="48" cy="245" r="18"/><circle cx="96" cy="245" r="18"/><circle cx="144" cy="245" r="18"/><circle cx="192" cy="245" r="18"/>
    <circle cx="48" cy="293" r="18"/><circle cx="96" cy="293" r="18"/><circle cx="144" cy="293" r="18"/><circle cx="192" cy="293" r="18"/>
    <circle cx="48" cy="341" r="18"/><circle cx="96" cy="341" r="18"/><circle cx="144" cy="341" r="18"/><circle cx="192" cy="341" r="18"/>
    <circle cx="48" cy="389" r="18"/><circle cx="96" cy="389" r="18"/><circle cx="144" cy="389" r="18"/><circle cx="192" cy="389" r="18"/>
  </g>
  <!-- the held card follows the finger -->
  <g transform="rotate(-6 128 110)">
    <rect x="102" y="66" width="56" height="100" rx="6" fill="#000" fill-opacity=".5" transform="translate(3 4)"/>
    <rect x="102" y="62" width="56" height="100" rx="6" fill="#fff"/>
    <rect x="102" y="62" width="56" height="13" rx="6" fill="#deddda"/>
    <g fill="#c0bfbc"><rect x="108" y="84" width="40" height="5" rx="2.5"/><rect x="108" y="95" width="26" height="5" rx="2.5"/><rect x="108" y="106" width="34" height="5" rx="2.5"/></g>
  </g>
  <circle cx="130" cy="128" r="12" fill="#1c71d8" stroke="#1c71d8" stroke-width="12" stroke-opacity=".5"/>
  <path d="M130 102a26 26 0 1 1-26 26" fill="none" stroke="#1c71d8" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 128H60" fill="none" stroke="#1c70d8" stroke-width="6" stroke-linecap="round"/>
  <path d="m70 118-10 10 10 10" fill="none" stroke="#1c70d8" stroke-width="6" stroke-linecap="round"/>
</svg>
