<svg xmlns="http://www.w3.org/2000/svg" width="240" height="400" viewBox="0 0 240 400">
  <!-- Hold a card halfway away for a second to force quit its app (phosh-plinius 0117) -->
  <path d="M30 10a15 15 0 0 0-15 15v375h210V25a15 15 0 0 0-15-15z" fill="#deddda" fill-opacity=".92"/>
  <rect x="105" y="17" width="30" height="5" rx="2.5" fill="#fff" fill-opacity=".92"/>
  <rect x="20" y="30" width="200" height="370" fill="#000"/>
  <!-- the cards next to it -->
  <path d="M20 80h15a5 5 0 0 1 5 5v200a5 5 0 0 1-5 5H20z" fill="#f6f5f4" fill-opacity=".2"/>
  <path d="M220 80h-15a5 5 0 0 0-5 5v200a5 5 0 0 0 5 5h15z" fill="#f6f5f4" fill-opacity=".2"/>
  <!-- where the card was, and the card held halfway away -->
  <rect x="61" y="81" width="118" height="208" rx="5" fill="none" stroke="#f6f5f4" stroke-opacity=".3" stroke-width="2" stroke-dasharray="5 4"/>
  <g opacity=".8">
    <path d="M60 30h120v150a5 5 0 0 1-5 5H65a5 5 0 0 1-5-5z" fill="#f6f5f4"/>
    <g fill="#c0bfbc"><rect x="72" y="44" width="70" height="6" rx="3"/><rect x="72" y="58" width="90" height="6" rx="3"/><rect x="72" y="72" width="56" height="6" rx="3"/></g>
  </g>
  <!-- swiped up halfway, then held -->
  <path d="M120 236v-50" fill="none" stroke="#1c70d8" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 12"/>
  <circle cx="120" cy="150" r="12" fill="#1c71d8" stroke="#1c71d8" stroke-width="12" stroke-opacity=".5"/>
  <path d="M120 124a26 26 0 1 1-26 26" fill="none" stroke="#1c71d8" stroke-width="4" stroke-linecap="round"/>
  <!-- the question whether to force quit -->
  <rect x="34" y="262" width="172" height="112" rx="14" fill="#303030"/>
  <rect x="78" y="280" width="84" height="7" rx="3.5" fill="#fff" fill-opacity=".85"/>
  <rect x="56" y="298" width="128" height="5" rx="2.5" fill="#fff" fill-opacity=".4"/>
  <rect x="68" y="310" width="104" height="5" rx="2.5" fill="#fff" fill-opacity=".4"/>
  <rect x="46" y="332" width="70" height="28" rx="10" fill="#fff" fill-opacity=".12"/>
  <rect x="66" y="344" width="30" height="5" rx="2.5" fill="#fff" fill-opacity=".6"/>
  <rect x="124" y="332" width="70" height="28" rx="10" fill="#ed333b"/>
  <rect x="139" y="344" width="40" height="5" rx="2.5" fill="#fbd6d8"/>
</svg>
