<svg xmlns="http://www.w3.org/2000/svg" width="240" height="400" viewBox="0 0 240 400">
  <!-- While the front camera is on, a ring of light runs around it (phosh-plinius 0021, 0057) -->
  <defs>
    <radialGradient id="glow" cx="120" cy="104" r="44" gradientUnits="userSpaceOnUse">
      <stop offset=".3" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lens">
      <circle cx="120" cy="104" r="62"/>
    </clipPath>
  </defs>
  <path d="M30 10a15 15 0 0 0-15 15v375h210V25a15 15 0 0 0-15-15z" fill="#deddda" fill-opacity=".92"/>
  <rect x="105" y="17" width="30" height="5" rx="2.5" fill="#fff" fill-opacity=".92"/>
  <rect x="20" y="30" width="200" height="370" fill="#000"/>
  <!-- the camera app: viewfinder and shutter button -->
  <rect x="20" y="52" width="200" height="290" fill="#f6f5f4" fill-opacity=".14"/>
  <path d="M20 300l50-56 34 34 46-62 70 84v42H20z" fill="#f6f5f4" fill-opacity=".12"/>
  <circle cx="64" cy="232" r="11" fill="#f6f5f4" fill-opacity=".12"/>
  <circle cx="120" cy="371" r="17" fill="#fff" fill-opacity=".9"/>
  <circle cx="120" cy="371" r="21" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2"/>
  <rect x="44" y="363" width="16" height="16" rx="4" fill="#f6f5f4" fill-opacity=".3"/>
  <circle cx="188" cy="371" r="9" fill="#f6f5f4" fill-opacity=".3"/>
  <!-- the camera hole, magnified -->
  <circle cx="120" cy="104" r="64" fill="#deddda"/>
  <g clip-path="url(#lens)">
    <rect x="40" y="0" width="160" height="208" fill="#000"/>
    <rect x="40" y="132" width="160" height="80" fill="#f6f5f4" fill-opacity=".14"/>
    <circle cx="120" cy="104" r="44" fill="url(#glow)"/>
    <!-- the ring: from the top clockwise, its front soft -->
    <path d="M120 82a22 22 0 1 1-22 22" fill="none" stroke="#fff" stroke-width="6"/>
    <path d="M98 104a22 22 0 0 1 3-11" fill="none" stroke="#fff" stroke-width="6" stroke-opacity=".6"/>
    <path d="M101 93a22 22 0 0 1 6-7" fill="none" stroke="#fff" stroke-width="6" stroke-opacity=".3"/>
    <path d="M107 86a22 22 0 0 1 6-3" fill="none" stroke="#fff" stroke-width="6" stroke-opacity=".12"/>
    <circle cx="120" cy="104" r="15" fill="#241f31" stroke="#5e5c64" stroke-width="2"/>
    <circle cx="120" cy="104" r="7" fill="#3d3846"/>
    <circle cx="116.5" cy="100.5" r="2.5" fill="#fff" fill-opacity=".35"/>
  </g>
  <circle cx="120" cy="104" r="62" fill="none" stroke="#f6f5f4" stroke-width="4"/>
</svg>
