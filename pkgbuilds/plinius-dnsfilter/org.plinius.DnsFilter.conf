<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- plinius-dnsfilter: only root owns the name. Anyone may call it; the service itself only
     answers root and the user of the active session if that user is an administrator (group
     wheel): the query log is private and the settings act for every account. -->
<busconfig>
  <policy user="root">
    <allow own="org.plinius.DnsFilter"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.plinius.DnsFilter" send_interface="org.plinius.DnsFilter"/>
    <allow send_destination="org.plinius.DnsFilter" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.plinius.DnsFilter" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.plinius.DnsFilter" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
