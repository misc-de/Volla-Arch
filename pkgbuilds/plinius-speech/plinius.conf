# speech-dispatcher: the system's speech output (plinius-speechd) as a generic module.
# /usr/lib/speech-dispatcher-modules/sd_plinius is a link to sd_generic, which reads this file.
# Voice, rate and language are the system's (Settings > Sound > Speech Output): what an app asks
# for is not passed on, so every speech output of the phone sounds the same.
# speech-dispatcher kills the command to stop; plinius-speak then stops the speech at once.

GenericExecuteSynth "printf %s \'$DATA\' | /usr/lib/plinius-speech/plinius-speak --stdin"
GenericCmdDependency "/usr/lib/plinius-speech/plinius-speak"

# Text, not SSML
GenericStripPunctChars ""
GenericRecodeFallback "?"

AddVoice "de" "MALE1" "system"
AddVoice "en" "MALE1" "system"
AddVoice "es" "MALE1" "system"
AddVoice "fr" "MALE1" "system"
AddVoice "it" "MALE1" "system"
AddVoice "nl" "MALE1" "system"
AddVoice "pl" "MALE1" "system"
AddVoice "pt" "MALE1" "system"
AddVoice "ru" "MALE1" "system"

GenericLanguage "de" "de" "utf-8"
GenericLanguage "en" "en" "utf-8"
GenericLanguage "es" "es" "utf-8"
GenericLanguage "fr" "fr" "utf-8"
GenericLanguage "it" "it" "utf-8"
GenericLanguage "nl" "nl" "utf-8"
GenericLanguage "pl" "pl" "utf-8"
GenericLanguage "pt" "pt" "utf-8"
GenericLanguage "ru" "ru" "utf-8"
