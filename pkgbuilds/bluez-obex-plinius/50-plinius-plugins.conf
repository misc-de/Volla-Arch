# obexd without the services nothing on the phone uses, each a way to the phone's data for any
# trusted device:
#   irmc     IrMC Sync hands out telecom/pb.vcf, all contacts, with no check at all. It went
#            past the per-device permission of patch 0004, which sits in the PBAP plugin only
#   pcsuite  Nokia PC Suite (file transfer plus backup)
#   ftp      OBEX File Transfer: browsing and writing obexd's folder
# Kept: opp (receiving a file or a contact card), pbap (the car's phone book, with the
# permission per device), mas/mns (messages for the car).
[Service]
ExecStart=
ExecStart=/usr/lib/bluetooth/obexd -P irmc,pcsuite,ftp
