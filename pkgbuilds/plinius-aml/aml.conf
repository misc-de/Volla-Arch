# plinius-aml: Advanced Mobile Location (ETSI TS 103 625) for emergency calls.
#
# During an emergency call the phone sends its GNSS position to the emergency services as an
# SMS that the user never sees. Where the SMS goes is agreed between each country's emergency
# services and the operating system providers, and it is not public. A country gets a message
# only once its group below has Enabled=true with a Number and a Port.

[General]
# Seconds from the start of the call until the message goes out at the latest (T1)
T1=20
# A GNSS fix at least this accurate (radius in metres) goes out at once, before T1
GoodAccuracy=30
# Below this battery level (in percent, not charging) GNSS stays off and the message goes
# without a location, so the call itself lasts longer
MinBattery=3

# One group per country, named by the network's mobile country code (MCC). Keys:
#   Enabled=true|false      off unless true
#   Number=                 SMS destination (digits, optionally with a leading +)
#   RoamingNumber=          destination for a SIM from another country, e.g. +<CC>112 as in
#                           GSMA NG.119; without it Number is used
#   Port=                   application port of the data SMS, fixed per operating system
#   SourcePort=             source port (default: Port)
#   Packing=gsm|legacy      GSM 7-bit as in TS 23.038 (default) or the bit order of the first
#                           implementations (TS 103 625 6.3.2, note 1)
#   IMEI=full|partial       partial keeps the 8-digit type allocation code only
#   EmergencyNumbers=112;110  only calls to these numbers (default: every emergency number)
#   T1=                     overrides T1 of [General]

# Germany: the destination is coordinated by the ILS Freiburg with the OS providers and has not
# been published. Off until it is known.
[Country 262]
Enabled=false
