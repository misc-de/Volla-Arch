
# Phone defaults from plinius-games (/usr/share/plinius-games/retroarch.cfg). They are added to
# the user's retroarch.cfg once, on the first start through "Games".

# Picture: OpenGL ES (RetroArch is built against libGLESv2), on the Mali GPU through libhybris
video_driver = "gl"
video_fullscreen = "true"

# Touch and keyboard from the compositor; udev would need read access to every input node.
# Controllers (Bluetooth, USB) come through udev.
input_driver = "wayland"
input_joypad_driver = "udev"

# Menu made for touch screens, as on Android; touch in the menu is off on Linux by default
menu_driver = "glui"
menu_pointer_enable = "true"

# On-screen gamepad; hidden while a controller is connected
input_overlay_enable = "true"
input_overlay = "/usr/share/libretro/overlays/gamepads/neo-retropad/neo-retropad.cfg"
input_overlay_auto_rotate = "true"
input_overlay_hide_in_menu = "true"
input_overlay_hide_when_gamepad_connected = "true"
input_overlay_opacity = "0.7"

# Folders as in Batocera: games in ~/Games, BIOS files in ~/Games/bios
rgui_browser_directory = "~/Games"
system_directory = "~/Games/bios"

# Sound straight to PipeWire
audio_driver = "pipewire"

# Pause while the app is not in front: no game runs on in the background
pause_nonactive = "true"
