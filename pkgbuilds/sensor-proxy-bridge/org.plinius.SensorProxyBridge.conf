<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- sensor-proxy-bridge: its own interface next to iio-sensor-proxy's on net.hadess.SensorProxy.
     The rotation speed is a property (allowed for anyone by iio-sensor-proxy's policy); the
     pick-up gesture is claimed by plinius-wake, which runs as root. The gravity and motion
     vectors are for anyone, like the other sensors (plinius-ambient runs in the user session). -->
<busconfig>
  <policy user="root">
    <allow send_destination="net.hadess.SensorProxy" send_interface="org.plinius.SensorProxyBridge"/>
  </policy>
  <policy context="default">
    <allow send_destination="net.hadess.SensorProxy" send_interface="org.plinius.SensorProxyBridge.Gravity"/>
  </policy>
</busconfig>
