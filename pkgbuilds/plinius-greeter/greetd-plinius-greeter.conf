# greetd with the configuration plinius-greeter-config makes for each start from
# /etc/greetd/config.toml: plinius-greeter instead of agreety, and with more than one login
# account no automatic login, nor for an account without a password yet (plinius-greeter package)
[Unit]
Wants=plinius-greeter-login.path plinius-greeter-password.path
After=plinius-greeter-login.path plinius-greeter-password.path

[Service]
ExecStart=
ExecStart=/usr/lib/plinius-greeter/plinius-greeter-config greetd
