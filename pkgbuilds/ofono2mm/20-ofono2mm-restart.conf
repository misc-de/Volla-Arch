# ofono2mm only requests org.freedesktop.ModemManager1 once its modems are exported; if that
# goes wrong it keeps running without the name. Give up after 45 s instead of 90 and start it
# again on any failure (ModemManager's own unit only restarts after a crash signal), so clients
# such as GNOME Settings are not left waiting for it until the next boot.

[Service]
TimeoutStartSec=45
Restart=on-failure
RestartSec=3
