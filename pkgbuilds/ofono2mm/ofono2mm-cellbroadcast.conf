<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  ModemManager 1.24's bus policy does not list org.freedesktop.ModemManager1.Modem.CellBroadcast,
  so only root may call it: Phosh could not list new warnings and cellbroadcastd could not set
  the warning channels. Listing is open to everyone as for SMS; changing the channel list and
  deleting messages is left to the phone's users (group radio, as in 50-ofono2mm-radio.rules).
  "mandatory": ModemManager's own file denies every method call in the default context, and
  the daemon may read that file after this one.
-->
<busconfig>
  <policy context="mandatory">
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Modem.CellBroadcast"
           send_member="List"/>
  </policy>

  <policy group="radio">
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Modem.CellBroadcast"
           send_member="SetChannels"/>
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Modem.CellBroadcast"
           send_member="Delete"/>
  </policy>
</busconfig>
