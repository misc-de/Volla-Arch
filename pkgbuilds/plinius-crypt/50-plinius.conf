# unl0kr and plinius-progress in the initramfs. The keyboard layout is the session's first one or
# else the system keymap (written by the mkinitcpio install hook into 40-plinius-keyboard.conf; US
# otherwise).
[keyboard]
# A phone's volume keys count as a keyboard, the on-screen one has to stay
autohide=false

[theme]
# The two looks of Phosh's on-screen keyboard over the blurred Phosh wallpaper; the theme button
# switches between them. These are the defaults of stevia-plinius: the install hook writes the look
# the user chose (and the accent color) into 60-plinius-look.conf.
default=plinius-original
alternate=plinius-glass
background=/usr/share/plinius-crypt/glass-background.bin
