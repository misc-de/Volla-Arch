# Plinius: "Restart UI" quits the shell with a failure status so that Restart=on-failure starts
# it again. Without RestartMode=direct, systemd puts the unit into the failed state first and
# triggers OnFailure=gnome-session-shutdown.target, which ends the whole session. With it the
# unit restarts right away; a shell crashing again and again still ends the session through
# the start limit (StartLimitBurst).
[Service]
RestartMode=direct
