<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Voice domains per SIM slot (GSM, LTE, 5G, Wi-Fi calling), offered by the MTK extension
     of ofono-binder-plugin inside ofonod. Members of "radio" (the phone's user) may read
     and change them, e.g. from Settings > Mobile Network. -->
<busconfig>
  <policy user="root">
    <allow own="org.plinius.Voice"/>
    <allow send_destination="org.plinius.Voice"/>
  </policy>
  <policy group="radio">
    <allow send_destination="org.plinius.Voice" send_interface="org.plinius.Voice1"/>
    <allow send_destination="org.plinius.Voice" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.plinius.Voice" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
