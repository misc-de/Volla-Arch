# Swap of this phone, changed through GNOME Settings › System › Memory and Swap
# (plinius-swap-set). Applied at boot by plinius-swap.service.

# The swap file on the home filesystem: yes or no
enabled=yes
# Its size in GiB
size_gib=8
# vm.swappiness, 1-200. The lower, the later the kernel swaps; 1 only when memory runs short.
swappiness=1
