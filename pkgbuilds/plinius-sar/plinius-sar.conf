# plinius-sar: SAR back-off of the modem's transmit power (MediaTek, AT+ERFIDX=1,<scene>)
# The power reduction behind each scene is stored in the modem (NV items); only the index is
# chosen here. -1 is normal power. Watch the sensor with: plinius-sar --monitor
[SAR]
# How the modem is told: "at" = AT+ERFIDX=1,<scene> through the RIL's OEM hook (works on the
# Plinius), "indicator" = sendSarIndicator near/away (SYS_SEND_SAR_IND, rejected by the Plinius modem)
Method=at
# Scene while a body is near the antenna
NearScene=0
# Scene when nobody is near
FarScene=-1
# A channel counts as "near" from this absolute value on (the sensor reports 0 for free space)
NearThreshold=1
# Channels (electrodes) that count, 0..2. On the Plinius channel 0 reacts to a hand laid on the
# device, channel 1 to holding it
Channels=0;1;2
# Wait this long after the last "near" report before switching back (ms)
FarDelayMs=1000
# Sensor sampling period (ms)
SamplingMs=200
# Send the current scene again this often, in case the modem restarted (0: never)
RefreshSeconds=600
# Try again this often after the RIL rejected a scene (radio off, no SIM)
RetrySeconds=30
# Modem slots to inform
Slots=slot1;slot2
