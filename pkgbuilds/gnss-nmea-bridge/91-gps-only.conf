# Locations for apps only from the phone's GNSS (gnss-nmea-bridge, [network-nmea]).
#
# Everything else is off: the IP source would fall back to the ISP's location via BeaconDB,
# WiFi and 3G send nearby networks and cell towers to a web service, the static source
# reports a fixed position from /etc/geolocation. modem-gps and cdma would go through
# ofono2mm, whose Location interface itself asks geoclue (a loop, no GPS of its own), and
# without them geoclue no longer waits for ModemManager at start.
# The compass stays: it only adds the heading to a GPS fix.

[ip]
enable=false

[wifi]
enable=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false

[static-source]
enable=false
