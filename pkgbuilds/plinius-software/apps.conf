# Local phone-suitability ratings for plinius-software. They take precedence over the app's
# own AppStream data (display_length). Meant for apps tested on the Plinius, or whose
# metadata is wrong.
#
# <AppStream ID>  <rating>  [note in English; the app shows it translated (*.po)]
#   phone    fits the phone screen
#   scaled   works, but some windows are too wide and get scaled down (phoc scale-to-fit)
#   desktop  large screens only
#
# A new note must also be added to CONF_NOTES in plinius-software so xgettext picks it up.

# Phone-ready with mobile-config-firefox (plinius-apps); declares no display_length
org.mozilla.firefox  phone  With the mobile tweaks from mobile-config-firefox

# Our retro games (plinius-retro-games, plinius.xml): RetroArch's touch menu and gamepad, the DOS
# Installer and ScummVM were tried on the phone; the catalog entry declares no display_length
org.plinius.RetroGames  phone
