# plinius-epo: orbit predictions for a faster GPS fix (GNOME Settings > Privacy > Location,
# "Faster GPS Fix"). Changed by plinius-epo-set; read by plinius-epo.service.

# yes: download the files every 6 hours and let mnld use them; no: remove them
enabled=yes

# Where the files come from. A mirror must serve the same names: EPO_GR_3_1, QG_R, QGA and
# QBD2 (.DAT and .MD5) below epo_url, MTKNAV.DAT and MTKNAV.MD5 below nav_url.
epo_url=https://uepodownload.mediatek.com
nav_url=https://ugepodownload.mediatek.com
