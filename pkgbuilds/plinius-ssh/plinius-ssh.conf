# Networks the SSH server takes logins from (GNOME Settings › System › Secure Shell ›
# Allowed Networks, which writes this file through plinius-ssh-set). Each is yes or no; they
# only matter while SSH is switched on.
#
#   usb    the USB network to a computer (USB settings › Network)
#   local  Wi-Fi, the hotspot and Ethernet adapters, from local addresses only
#   all    every network, also mobile data, VPN and the internet
#
# Changes by hand take effect with: plinius-ssh-set apply
usb=yes
local=no
all=no
