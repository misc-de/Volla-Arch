<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- plinius-wake: only root owns the name and reports the display state (SetDisplay, from the
     hook of plinius-backlight-wake). Anyone may read and switch the wake gestures
     (GNOME Settings > Display), as with iio-sensor-proxy's properties. -->
<busconfig>
  <policy user="root">
    <allow own="org.plinius.Wake"/>
    <allow send_destination="org.plinius.Wake" send_interface="org.plinius.Wake"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.plinius.Wake" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.plinius.Wake" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.plinius.Wake" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
