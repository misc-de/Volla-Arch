# oFono on the Plinius: which SIM carries mobile data.
# With two slots oFono picks none unless one is chosen (DefaultDataSim in /var/lib/ofono/ril),
# and mobile data stayed off with a single SIM. "on": the SIM that is there, as long as the
# chosen one is missing or none was chosen.
[ModemManager]
AutoSelectDataSim=on
