# Key-based login only; the image ships no password.
PasswordAuthentication no
# The journal names the key of every login (fingerprint), not only the user. Global settings must
# come before the Match block below; 40-plinius-ssh.conf (plinius-ssh) only holds Match blocks.
LogLevel VERBOSE
KbdInteractiveAuthentication no
# Login only over the USB network (the device's address there, 40-plinius-usb.network). Over
# Wi-Fi or mobile data (IPv6 is often reachable from the internet) no login method is left.
# A Match block rather than ListenAddress: sshd starts before usb0 has its address and could
# not bind to it. The block ends with this file, the settings of sshd_config stay global.
PubkeyAuthentication no
Match LocalAddress 10.15.19.82
	PubkeyAuthentication yes
