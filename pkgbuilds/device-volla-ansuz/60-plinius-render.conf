# GTK draws with GL (Mali through libhybris; buffers go to phoc as dma-bufs). Vulkan is there too
# (hybris-vulkan), but GTK's Vulkan renderer crashed in its dma-buf path; the driver imports
# dma-bufs and cannot export them, and only with dma-bufs off did GTK draw (measured
# 2026-11-22). Phosh runs as a user service and passes this on to the apps it starts.
GDK_DISABLE=vulkan
