# Journal on the memory card: at most 512 MB instead of 10 % of the root partition (1.6 GB, which
# the vendor drivers' kernel log filled within days). Smaller files keep journalctl fast on the card.
#
# Only notice and above is stored. The vendor modules (display, fuel gauge, GPS, UFS) print status
# lines at info several times a second: on 2026-11-15, 60 600 of 95 000 journal lines an hour were
# info or debug, almost all of them from the kernel. Kept: every warning and error, failed units,
# core dumps, our services' g_message() lines (notice) and the AppArmor audit lines (notice, read
# by tools/aa-denials.sh). Gone: unit start/stop lines, SSH logins (sshd logs them at info),
# NetworkManager details and the Android container's init lines.
# For a debugging session raise it until the next boot:
#   mkdir -p /run/systemd/journald.conf.d
#   printf '[Journal]\nMaxLevelStore=debug\n' >/run/systemd/journald.conf.d/90-verbose.conf
#   systemctl restart systemd-journald
# The full kernel log stays in dmesg either way.
#
# The kernel log reaches the journal through plinius-kmsg, not journald itself: the vendor drivers'
# status lines at notice and above (34 000 an hour on 2026-11-25, 84 % of the kernel's lines) stay
# out by its list /usr/lib/plinius-kmsg/drop.list. Its lines carry SYSLOG_IDENTIFIER=kernel:
# `journalctl -t kernel` shows them, `journalctl -k` only lines of earlier boots.
[Journal]
SystemMaxUse=512M
MaxLevelStore=notice
ReadKMsg=no
