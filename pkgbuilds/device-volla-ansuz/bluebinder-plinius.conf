# bluebinder on the Plinius: the Bluetooth HAL runs in our Android container (Sailfish:
# droid-hal-init.service), and the address from NVRAM must be set before the HAL starts.
[Unit]
After=lxc-android-config.service
Requires=lxc-android-config.service

[Service]
ExecStartPre=/usr/bin/droid/droid-get-bt-address.sh
