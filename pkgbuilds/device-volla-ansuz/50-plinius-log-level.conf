# What our own programs write to stdout and stderr without a "<N>" prefix (the error messages of
# g_printerr() and fprintf(), Python tracebacks, the lines of our shell scripts) reaches the
# journal at notice instead of systemd's default info: 50-plinius-journald.conf stores only notice
# and above, so a service that failed used to leave no reason behind. GLib's g_warning() and
# g_message() and lines with a "<N>" prefix keep their own level.
# Notice rather than warning: some services write status lines to stdout (the self-test after the
# boot, the CVE and EPO updates, a few lines a run). Measured on 2026-11-25: in ten minutes of
# normal use our services wrote no such line at all, so this keeps the journal's size.
# Installed for every unit plinius-*.service (prefix drop-in) and for our units without the prefix.
[Service]
SyslogLevel=notice
