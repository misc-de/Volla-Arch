# Plinius: the Android container works on copies of the device partitions in /userdata (from the
# UT overlay: the SELinux labels of the originals get in the way). mount-android-partitions
# prefers /userdata/<name>.img to the partition. umask 077: nvdata holds IMEI and MAC addresses.
# And never on Volla OS' own metadata partition (encryption metadata of its userdata), which UT
# mounts writable: a private directory takes its place, the script skips mounted mount points.
[Service]
ExecStartPre=-/bin/sh -c 'umask 077; for p in nvcfg nvdata persist protect1 protect2; do [ -f /userdata/$p.img ] || cp /dev/disk/by-partlabel/$p /userdata/$p.img; done'
ExecStartPre=/bin/sh -c 'install -d -m 700 /userdata/android-metadata && { mountpoint -q /android/metadata || mount --bind /userdata/android-metadata /android/metadata; }'
