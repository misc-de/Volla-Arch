# ofono on the Plinius: the radio HAL runs in our Android container
[Unit]
After=lxc-android-config.service
Requires=lxc-android-config.service

# Hands-free (HFP audio gateway) belongs to PipeWire: BlueZ hands the UUID to whoever registers
# first, and ofono's plugin lost or won depending on boot order (the headset then had no
# hands-free profile at all). PipeWire's native backend holds the SCO link the audio HAL needs.
[Service]
ExecStart=
ExecStart=/usr/sbin/ofonod -n --nobacktrace --noplugin=hfp_ag_bluez5 $OFONO_ARGS $OFONO_DEBUG
