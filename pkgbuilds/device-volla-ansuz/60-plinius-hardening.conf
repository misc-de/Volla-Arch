# Kernel hardening that costs nothing in daily use (Lynis audit of 2026-11-07, docs/SICHERHEIT.md).
# Left out on purpose: kernel.modules_disabled (modules load late: plinius-kmod, vendor, gadget),
# a strict rp_filter (Wi-Fi, mobile data, IMS, hotspot and USB at once drop answers) and
# log_martians (fills the journal on carrier networks). Named 60 to come after systemd's 50-*.

# The kernel log only for root; debug with `sudo dmesg` or `journalctl -k`
kernel.dmesg_restrict = 1
# No bpf() without CAP_BPF/CAP_SYS_ADMIN. 2 rather than 1: root may set it back without a reboot.
# plinius-netlogd loads its programs as root.
kernel.unprivileged_bpf_disabled = 2
# Constant blinding in the BPF JIT for every program, a few instructions more per run
net.core.bpf_jit_harden = 2
# Line disciplines load as modules only for CAP_SYS_MODULE; Bluetooth and the modem go over binder
dev.tty.ldisc_autoload = 0
# No core dumps of setuid programs (systemd's 50-coredump.conf sets 2). Pipe core dumps never
# reach systemd-coredump on this kernel anyway (STATIC_USERMODEHELPER_PATH="").
fs.suid_dumpable = 0
# O_CREAT on others' FIFOs and files also in group-writable sticky directories (systemd sets 1)
fs.protected_fifos = 2
fs.protected_regular = 2

# The phone is not a router; the hotspot (plinius-usb, ip_forward) needs no ICMP redirects either.
# "all" and "default" both: existing interfaces take "all", new ones (wlan0, ccmni*, ap0) "default".
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
