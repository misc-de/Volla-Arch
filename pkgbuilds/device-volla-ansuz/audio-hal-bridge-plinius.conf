# audio-hal-bridge on the Plinius: load the audio HAL in the vendor namespace, as Android's own
# HAL services do. In the system namespace its VNDK libraries are not reachable for users other
# than root. The VNDK comes first so that libhardware is the vendor's.
[Service]
Environment=HYBRIS_USE_VENDOR_NAMESPACE=1
Environment=HYBRIS_LD_LIBRARY_PATH=/apex/com.android.vndk.v34/lib64:/vendor/lib64:/vendor/lib64/hw
