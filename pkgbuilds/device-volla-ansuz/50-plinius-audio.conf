# The sound card only works under the control of the vendor audio HAL (audio-hal-bridge provides
# the speaker and the microphone): hide its raw PCM and compress devices.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
      { device.name = "alsa_card.comprC0" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

# A Bluetooth or USB audio device that connects becomes the default output, its microphone the
# default input; see plinius/new-device-default.lua
wireplumber.components = [
  {
    name = plinius/new-device-default.lua, type = script/lua
    provides = hooks.default-nodes.plinius-new-device
  }
  # Wanted by a virtual component: a broken hook does not stop WirePlumber
  {
    type = virtual, provides = policy.plinius-new-device
    wants = [ hooks.default-nodes.plinius-new-device ]
  }
  # A Bluetooth headset is in hands-free only while audio-hal-bridge needs it: a stored
  # hands-free profile does not come back, a call's hands-free is not undone; see
  # plinius/bt-hands-free-profile.lua
  {
    name = plinius/bt-hands-free-profile.lua, type = script/lua
    provides = hooks.device.profile.plinius-bt-hands-free
  }
  {
    type = virtual, provides = policy.plinius-bt-hands-free
    wants = [ hooks.device.profile.plinius-bt-hands-free ]
  }
]

wireplumber.profiles = {
  main = {
    policy.plinius-new-device = required
    policy.plinius-bt-hands-free = required
  }
}

wireplumber.settings = {
  # Do not offer the Bluetooth headset's host-side microphone: SCO audio never crosses HCI here
  # (sco_rx stays 0 with a standing eSCO link), so bluez_input.* records digital silence, and
  # with this on it is listed even in A2DP and opening it switches the headset to hands-free.
  # The headset microphone goes through the audio HAL (BTCVSD) instead.
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  # Only the roles a phone has. The default also offers the headset roles (a2dp_sink, hfp_hf,
  # hsp_hs): hfp_hf collides with ofono's registration ("already registered"), and together they
  # form the card profile "audio-gateway", which outranks A2DP and has no nodes (furios_audio).
  bluez5.roles = [ a2dp_source hfp_ag hsp_ag ]
  # Tell the headset about real calls: the hands-free gateway takes them from ModemManager
  # (ofono2mm here), but only with this set; else every AT+CLCC is answered "no calls" while a
  # call runs, and headsets drop the voice link (furios_audio, btmon). Also lets the headset's
  # button answer and hang up.
  bluez5.hfphsp-backend-native-modem = "any"
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        # Connect the missing profiles ourselves: after a WirePlumber restart a headset often
        # brings back only its hands-free link, and media then plays on the phone's speaker or in
        # mono. PipeWire reads this per device (not from monitor.bluez.properties) and names the
        # remote device's roles: a headset is a2dp_sink + hfp_hf/hsp_hs.
        bluez5.auto-connect = [ a2dp_sink hfp_hf hsp_hs ]
      }
    }
  }
]
