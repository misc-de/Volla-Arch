# Free memory the kernel keeps at hand. On Android, system_server raises the low watermark through
# sys.sysctl.extra_free_kbytes (sized from the screen); without it, as here, the kernel's own
# default for 11.4 GiB stays: 13.3 MiB minimum, kswapd waking only 11 MiB above that. A burst of
# GPU buffers then took the last free pages faster than kswapd reclaimed, every free page was a
# single 4 KiB one, and the OOM killer ended a process for an 8 KiB kernel allocation while
# 7 GiB of page cache and the whole swap were still there. Android's init touches neither value
# (only watermark_boost_factor, set to 0); the MediaTek power HAL has a resource for the scale
# factor but no scenario that uses it.

# Reserve for atomic allocations and the floor of the watermarks
vm.min_free_kbytes = 32768
# kswapd wakes 1.5 % of memory (about 175 MiB) above the minimum and reclaims up to twice that
vm.watermark_scale_factor = 150
