# Sandbox for nfcd (docs/DIENSTE-HAERTEN.md). It reads whatever a tag in range sends. It
# already runs as nfc without capabilities; it needs D-Bus, binder/hwbinder to the NFC HAL
# and its settings in /var/lib/nfcd. plinius-nfc-power (ExecStartPost) only reads the display
# state and talks D-Bus.
[Service]
CapabilityBoundingSet=
AmbientCapabilities=
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/nfcd
ProtectHome=yes
PrivateTmp=yes
# D-Bus goes through a socket in the file system, which works from its own network namespace
PrivateNetwork=yes
PrivateIPC=yes
# PrivateDevices= would hide /dev/binderfs
DevicePolicy=closed
DeviceAllow=/dev/binderfs/binder rw
DeviceAllow=/dev/binderfs/hwbinder rw
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
# Not ProtectProc=: libdbusaccess checks each D-Bus caller through /proc/<pid>
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictAddressFamilies=AF_UNIX
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
UMask=0077
