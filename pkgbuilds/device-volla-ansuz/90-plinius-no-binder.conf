# Services that read data from the network (or radio) and need no Android binder: no binder
# nodes for them. /dev/binder* are 0666, as on Android, where SELinux decides who may talk to
# which HAL; here a service taken over through its network side could otherwise reach every
# HAL (gatekeeper, fingerprint, radio, camera). Measured 2026-11-11: none of these opens
# binder. Not for sshd and udisks2: their sessions and mounts would inherit the namespace.
[Service]
InaccessiblePaths=-/dev/binderfs
