# Device facts for GNOME Settings (gnome-control-center-plinius, cc-plinius-device.c)

[Device]
# System > About > Processor; /proc/cpuinfo on ARM has no model name
Processor=MediaTek Dimensity 7300 (4× Cortex-A78, 4× Cortex-A55)

[Display]
# Scale of the built-in panel that Settings shows as 100 %; it offers 100-200 % of it.
# 1.5: 200 % is scale 3 (360×800 logical pixels on 1080×2400, the default in phoc.ini).
ScaleBase=1.5

[Energy]
# For plinius-energy: what the battery loses per milliwatt of the kernel's energy model with a
# performance domain fully loaded (the model knows the cores only, not caches, memory and
# regulators), as <kHz>:<factor> points, interpolated between them. Measured 2026-11-10 with
# four loaded cores, display off, against the idle current: big cores 1.69 at 1.0 GHz, 1.80 at
# 1.5, 2.02 at 2.0, 2.4 at 2.5 GHz; little cores 3.5, 4.5 and 3.0 at 1.0, 1.5 and 2.0 GHz (small
# against the idle noise, one mean value).
cpu0=3.5
cpu4=1000000:1.7,1500000:1.8,2000000:2.0,2500000:2.4
