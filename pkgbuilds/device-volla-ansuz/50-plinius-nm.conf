# usb0 is the SSH gadget network of systemd-networkd (40-plinius-usb.network); p2p0 only
# exists so that the driver can run ap0 (hotspot) and is not a connection of its own.
[keyfile]
unmanaged-devices=interface-name:usb0;interface-name:p2p*

# The GKI kernel has no nf_tables, only the legacy iptables (package iptables-legacy).
# Otherwise NetworkManager picks nft and a hotspot gets no NAT.
[main]
firewall-backend=iptables

# Hotspot on ap0: the driver rejects stations that associate with PMF or PSK-SHA256
# (status 43). Without PMF, wpa_supplicant-plinius offers plain WPA2-PSK.
[connection-plinius-hotspot]
match-device=interface-name:ap0
wifi-sec.pmf=1

# Wake on WLAN: without it cfg80211 disconnects on every suspend and the reconnect wakes the phone
# again; with "any" (2) the firmware keeps the link and wakes the host on traffic (docs/STANDBY.md).
[connection-plinius-wowlan]
match-device=interface-name:wlan0
wifi.wake-on-wlan=2

# ap0 is only there for the hotspot and the driver cannot scan on it (-22, also with iw). Without a
# new random MAC per scan the failed attempts fall from 11 to 3 in 5 min (docs/STANDBY.md).
[device-plinius-ap0]
match-device=interface-name:ap0
wifi.scan-rand-mac-address=no
