# Sandbox for biomd (docs/DIENSTE-HAERTEN.md). It holds the fingerprint templates and answers
# PAM and fprintd clients. Root only for its bus names, no capabilities: binder/hwbinder to the
# fingerprint HAL, D-Bus (logind, polkit) and its database in /var/lib/biomd.
[Service]
CapabilityBoundingSet=
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/biomd
ProtectHome=yes
PrivateTmp=yes
PrivateIPC=yes
PrivateNetwork=yes
DevicePolicy=closed
DeviceAllow=/dev/binderfs/binder rw
DeviceAllow=/dev/binderfs/hwbinder rw
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictAddressFamilies=AF_UNIX
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
UMask=0077
