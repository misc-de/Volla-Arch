# ofono-binder-plugin on the Plinius: AIDL radio HAL (Android 14) on /dev/binder, two SIM slots.
# ofono talks to the RIL as Android's radio user (aid_radio, plinius-android.sysusers).
[Settings]
Device=/dev/binder
InterfaceType=aidl
ExpectSlots=slot1,slot2
Identity=aid_radio:aid_radio
# MediaTek's radio extension (ofono-binder-plugin-ext-mtk): registers the IMS callbacks with
# vendor.mediatek.hardware.mtkradioex. Without it the RIL waits in vain for the approval of
# incoming VoLTE calls (incomingCallIndication, mtkImsVoiceIndication == NULL), the network
# gives up after a few seconds and sends a missed-call SMS (2026-11-02).
extPlugin=mtk

# useNetworkScan: the network search uses startNetworkScan (all access technologies). The RIL's
# old getAvailableNetworks found only the network in use, as "gsm" (measured 2026-11-08: 1 network
# against 3 with LTE and NR). For the network list in Settings and plinius-satellite --scan.
[slot1]
path=/ril_0
useNetworkScan=true

[slot2]
path=/ril_1
useNetworkScan=true
