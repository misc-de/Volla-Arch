# Sandbox for cupsd (docs/DIENSTE-HAERTEN.md). It takes print jobs and talks to printers on
# the network. It stays root: filters run as lp (209), while backends that are not world
# executable (cups-pdf, ipp, dnssd, lpd, usb) run as root. cups-pdf writes to
# /var/spool/cups-pdf/<user>, not into a home. Everything it starts inherits this sandbox.
[Service]
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_FOWNER CAP_FSETID CAP_KILL CAP_SETUID CAP_SETGID CAP_NET_BIND_SERVICE
NoNewPrivileges=yes
ProtectSystem=strict
# Its configuration (printers.conf is rewritten), spools (cups-pdf too), cache and logs
ReadWritePaths=/etc/cups /var/spool /var/cache/cups /var/log/cups /run/cups
ProtectHome=yes
PrivateTmp=yes
PrivateIPC=yes
# USB printers through libusb (usb_device) or usblp (usb); nothing else
DevicePolicy=closed
DeviceAllow=char-usb_device rw
DeviceAllow=char-usb rw
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
