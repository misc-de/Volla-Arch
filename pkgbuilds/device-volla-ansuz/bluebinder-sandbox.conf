# More sandbox for bluebinder (docs/DIENSTE-HAERTEN.md), on top of upstream's capabilities,
# devices and address families. The helper scripts read Android properties and NVRAM and
# write only /var/lib/bluetooth/board-address.
[Service]
ProtectSystem=strict
ReadWritePaths=/var/lib/bluetooth
PrivateIPC=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
