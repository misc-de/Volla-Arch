# libhybris on the Plinius (Halium 14), as on Ubuntu Touch: the Android linker searches here for the
# libraries a vendor driver needs; optional static TLS for libhybris' linker (initial-exec TLS).
HYBRIS_LD_LIBRARY_PATH=/system/lib64:/apex/com.android.vndk.v34/lib64:/vendor/lib64/hw
GLIBC_TUNABLES=glibc.rtld.optional_static_tls=4096
# Only libhybris as EGL vendor: Mesa's would offer EGL_EXT_device for card0, which wlroots prefers
__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_libhybris.json
