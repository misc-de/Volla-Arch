# Sandbox for ofono (docs/DIENSTE-HAERTEN.md). It parses SMS, cell broadcasts and everything
# else the network sends. It starts as root and switches itself to aid_radio, keeping only
# NET_ADMIN and NET_RAW for the data interfaces (ccmni*). It needs D-Bus, binder to the radio
# HAL, netlink and an inet socket for the interfaces, and writes only /var/lib/ofono.
[Service]
# The binder plugin first fixes the owner of /var/lib/ofono as root (CHOWN, FOWNER,
# DAC_READ_SEARCH), then switches with setgid/setuid and drops all but NET_ADMIN/NET_RAW itself.
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_CHOWN CAP_FOWNER CAP_DAC_READ_SEARCH CAP_NET_ADMIN CAP_NET_RAW
# Upstream's User=root makes systemd take CAP_SETUID out of a reduced bounding set (measured
# with systemd-run), and setuid(aid_radio) then fails. Without User= it starts as root anyway.
User=
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/ofono
ProtectHome=yes
PrivateTmp=yes
PrivateIPC=yes
# PrivateDevices= would hide /dev/binderfs
DevicePolicy=closed
DeviceAllow=/dev/binderfs/binder rw
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
# Not ProtectProc=: libdbusaccess checks each D-Bus caller through /proc/<pid> (measured on nfcd)
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
