# Role based volumes: every stream plays through a sink of its role (media, notifications, calls,
# alarms, ringtones, emergency alerts), and that sink's volume is a share of the output volume.
# The volume keys change the output volume, the role sinks keep their ratio; phosh-mobile-settings
# (Feedback) and the phosh volume OSD show one slider per role.
# Based on feedbackd's data/media-role-nodes.conf (0.8.9), which Arch builds without media-roles,
# itself based on WirePlumber's example media-role-nodes.conf. Our additions are marked "Plinius".
# audio-hal-bridge's hooks (alerts-to-speaker.lua, sco-to-hal.lua) know these sinks by name.

wireplumber.profiles = {
  main = {
    policy.linking.role-based.loopbacks = required
  }
}

wireplumber.settings = {
  # A stream without a role is media
  node.stream.default-media-role = "Multimedia"
  # A notification over music: the music plays on at half volume
  linking.role-based.duck-level = 0.5
}

wireplumber.components.rules = [
  {
    matches = [
      {
        provides = "~loopback.sink.*"
      }
    ]
    actions = {
      merge = {
        arguments = {
          capture.props = {
            # Links between streams and these sinks follow the role based policy
            policy.role-based.target = true

            audio.position = [ FL, FR ]
            media.class = Audio/Sink
          }
          playback.props = {
            # The real output suspends when no stream plays into a role sink
            node.passive = true
            # An unused role: the role sinks never link into one another
            media.role = "Loopback"
          }
        }
        requires = [ support.export-core, pw.node-factory.adapter ]
      }
    }
  }
]

wireplumber.components = [
  {
    type = virtual, provides = policy.linking.role-based.loopbacks
    requires = [ loopback.sink.role.multimedia
                 loopback.sink.role.notification
                 loopback.sink.role.phone
                 loopback.sink.role.alarm
                 loopback.sink.role.ringtone
                 loopback.sink.role.alert ]
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.name = "loopback.sink.role.multimedia"
      node.description = "Multimedia"
      capture.props = {
        device.intended-roles = [ "Music", "Movie", "Game", "Multimedia" ]
        device.icon-name = "applications-multimedia"
        policy.role-based.priority = 10
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
      }
    }
    provides = loopback.sink.role.multimedia
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      # System events from e.g. notifications
      node.name = "loopback.sink.role.notification"
      node.description = "System Events and Notifications"
      capture.props = {
        # Plinius: "Event" too, the role of libcanberra/GSound event sounds, which is a
        # notification sound on a phone (alerts-to-speaker.lua treats it so as well)
        device.intended-roles = [ "Notification", "Event" ]
        device.icon-name = "preferences-system-notifications"
        policy.role-based.priority = 20
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "duck"
      }
    }
    provides = loopback.sink.role.notification
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      # Voice calls (a mobile call's voice goes past PipeWire, see audio-hal-bridge)
      node.name = "loopback.sink.role.phone"
      node.description = "Phone Calls"
      capture.props = {
        device.intended-roles = [ "Communication", "Phone" ]
        device.icon-name = "phone-ongoing-call"
        policy.role-based.priority = 25
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "cork"
      }
    }
    provides = loopback.sink.role.phone
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      # Alarm clocks
      node.name = "loopback.sink.role.alarm"
      node.description = "Alarm Clocks"
      capture.props = {
        device.intended-roles = [ "Alarm" ]
        device.icon-name = "alarm"
        policy.role-based.priority = 30
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "duck"
        policy.role-based.preferred-target = "Speaker"
      }
    }
    provides = loopback.sink.role.alarm
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      # Phone call ring tones
      node.name = "loopback.sink.role.ringtone"
      node.description = "Ringtones"
      capture.props = {
        device.intended-roles = [ "Ringtone" ]
        device.icon-name = "call-ring"
        policy.role-based.priority = 40
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "cork"
      }
    }
    provides = loopback.sink.role.ringtone
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      # Cell broadcasts and other emergency alerts
      node.name = "loopback.sink.role.alert"
      node.description = "Alerts"
      capture.props = {
        device.intended-roles = [ "Alert", "Emergency" ]
        device.icon-name = "network-cellular"
        policy.role-based.priority = 100
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "cork"
        policy.role-based.preferred-target = "Speaker"
      }
    }
    provides = loopback.sink.role.alert
  }
]
