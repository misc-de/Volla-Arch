<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- plinius-netlogd: only root owns the name; anyone may ask, the daemon itself answers
     only root and regular users (uid >= 1000) with a session at logind, and shows all
     connections only to root and administrators (group wheel), to anyone else its own -->
<busconfig>
  <policy user="root">
    <allow own="org.plinius.NetLog1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.plinius.NetLog1" send_interface="org.plinius.NetLog1"/>
    <allow send_destination="org.plinius.NetLog1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
