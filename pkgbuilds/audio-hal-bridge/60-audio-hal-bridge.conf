# audio-hal-bridge: alerts (ringtone, alarm, notifications) never play in the earpiece sink
wireplumber.components = [
  {
    name = audio-hal-bridge/alerts-to-speaker.lua, type = script/lua
    provides = hooks.linking.target.audio-hal-bridge-alerts
  }
  # A headset in hands-free: its voice goes through the HAL (sco-to-hal.lua)
  {
    name = audio-hal-bridge/sco-to-hal.lua, type = script/lua
    provides = hooks.linking.target.audio-hal-bridge-sco
  }
  # An optional feature only loads when something wants it; the virtual component cannot
  # fail, and a broken hook (wanted, not required) does not stop WirePlumber
  {
    type = virtual, provides = policy.audio-hal-bridge
    wants = [ hooks.linking.target.audio-hal-bridge-alerts
              hooks.linking.target.audio-hal-bridge-sco ]
  }
]

wireplumber.profiles = {
  main = {
    policy.audio-hal-bridge = required
  }
}
