# Sandbox for routectld (docs/DIENSTE-HAERTEN.md), not measured on the device yet. It runs as
# root because it adds and removes routes (NET_ADMIN). It asks oFono over D-Bus which interface
# the MMS context uses, talks netlink, and writes nothing: its socket comes from routectld.socket
# with mode and group set (patch 0012).
[Service]
# Patch 0003: the socket moves out of /run into a directory of its own; mmsd's user unit gets
# the same path (mmsd-routectl-socket.conf). No RuntimeDirectory: it would be removed with the
# socket in it each time routectld ends when idle
Environment=MMSD_ROUTECTL_SOCKET=/run/mmsroutectl/socket
CapabilityBoundingSet=CAP_NET_ADMIN
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
PrivateIPC=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictAddressFamilies=AF_UNIX AF_NETLINK
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
