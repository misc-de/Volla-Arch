# mmsd parses what an SMS (the notification) and an MMSC send. As a user service it may not have
# every sandbox option; these work without privileges (attack review 2026-11-12, E7; mms-standin
# passes all its cases under them). The AppArmor profile plinius.mmsd (plinius-apparmor) comes on
# top of it.
[Service]
NoNewPrivileges=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallFilter=@system-service
SystemCallArchitectures=native
LockPersonality=yes
RestrictRealtime=yes
RestrictNamespaces=yes
MemoryHigh=192M
MemoryMax=256M
# Only tools/mms-standin.py sets it, for its own mmsd; from the user manager's environment it
# would let the real one fetch from 127.0.0.1
UnsetEnvironment=MMSD_ALLOW_LOOPBACK_MMSC
