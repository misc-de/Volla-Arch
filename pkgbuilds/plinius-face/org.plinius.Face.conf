<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- plinius-face: only root owns the name. Every user may call it; the service only ever acts
     on the caller's own face (GNOME Settings > Users). -->
<busconfig>
  <policy user="root">
    <allow own="org.plinius.Face"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.plinius.Face" send_interface="org.plinius.Face1"/>
    <allow send_destination="org.plinius.Face" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.plinius.Face" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
