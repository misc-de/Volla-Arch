<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- plinius-usb: only root owns the name. Anyone may call it; the service itself only lets the
     unlocked user in front of the phone (or root) switch functions on. -->
<busconfig>
  <policy user="root">
    <allow own="org.plinius.Usb"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.plinius.Usb" send_interface="org.plinius.Usb"/>
    <allow send_destination="org.plinius.Usb" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.plinius.Usb" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.plinius.Usb" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
