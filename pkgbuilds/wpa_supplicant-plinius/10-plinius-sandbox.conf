# Sandbox for wpa_supplicant (docs/DIENSTE-HAERTEN.md). It parses frames from any access point
# in range, so it gets only what it needs: nl80211 and packet sockets, /dev/rfkill and its
# control directory. It stays root because the D-Bus policy lets only root own
# fi.w1.wpa_supplicant1, but without any capability except NET_ADMIN and NET_RAW.
[Service]
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
NoNewPrivileges=yes
ProtectSystem=strict
# Control sockets for wpa_cli (-O /run/wpa_supplicant)
RuntimeDirectory=wpa_supplicant
RuntimeDirectoryMode=0750
# Certificates for enterprise networks may live in a home directory
ProtectHome=read-only
PrivateTmp=yes
PrivateIPC=yes
# PrivateDevices= would hide /dev/rfkill
DevicePolicy=closed
DeviceAllow=/dev/rfkill rw
ProtectKernelTunables=yes
# nl80211 sets the per-interface frame filters (drop_unicast_in_l2_multicast,
# drop_gratuitous_arp, drop_unsolicited_na); the rest of /proc/sys stays read-only
ReadWritePaths=/proc/sys/net/ipv4/conf /proc/sys/net/ipv6/conf
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
# AF_INET/AF_INET6 for the interface ioctls, AF_PACKET for EAPOL, AF_NETLINK for nl80211
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_PACKET AF_INET AF_INET6
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
UMask=0077
