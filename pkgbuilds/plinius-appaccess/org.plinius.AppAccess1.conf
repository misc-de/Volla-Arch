<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- plinius-appaccessd: only root owns the name; anyone may call, the daemon itself decides who
     may read (root, users with a session), change (GNOME Settings, the agent: policies only for
     administrators, "allow once" for the caller's own apps), count uses (camera-hal-bridge) and
     refusals of the camera portal and the microphone's attempts (the agent, for the apps of its
     own account) -->
<busconfig>
  <policy user="root">
    <allow own="org.plinius.AppAccess1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.plinius.AppAccess1" send_interface="org.plinius.AppAccess1"/>
    <allow send_destination="org.plinius.AppAccess1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
