# plinius-appaccess: the microphone per app, as plinius-appaccessd decides
# (find-plinius-microphone-access.lua); the file monitor sees the daemon's verdicts change
wireplumber.components = [
  {
    name = plinius/find-plinius-microphone-access.lua, type = script/lua
    provides = script.client.access-plinius-microphone
    requires = [ script.client.access-default, api.file-monitor ]
  }
  {
    type = virtual, provides = policy.plinius-microphone-access
    wants = [ script.client.access-plinius-microphone ]
  }
]

wireplumber.profiles = {
  main = {
    policy.plinius-microphone-access = required
  }
}
