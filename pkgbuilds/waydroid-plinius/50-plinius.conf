# waydroid-plinius: the set-up for the Plinius before every start of the container service
[Unit]
# The HAL bridges first: Android gets VINTF entries only for the bridges that run. Battery and
# NFC serve only Android and start with it; the others run for Linux anyway
Wants=health-hal-bridge.service nfc-hal-bridge.service
After=sensor-proxy-bridge.service gnss-nmea-bridge.service vibrator-ff-bridge.service health-hal-bridge.service
After=nfc-hal-bridge.service
# Android's screen follows the phone's lock while the container runs
Wants=waydroid-plinius-screen.service
# Only with an initialised Waydroid: until the Android image is there, nothing starts at boot
ConditionPathExists=/var/lib/waydroid/waydroid.cfg

[Service]
ExecStartPre=/usr/lib/waydroid-plinius/waydroid-plinius-setup
# What the set-up reports (graphics, libraries, display) reaches the journal, which stores notice
SyslogLevel=notice
