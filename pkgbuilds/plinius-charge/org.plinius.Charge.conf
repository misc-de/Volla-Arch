<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- plinius-charge: only root owns the name. Anyone may read and switch the charging options
     (GNOME Settings > Power), as with plinius-wake. -->
<busconfig>
  <policy user="root">
    <allow own="org.plinius.Charge"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.plinius.Charge" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.plinius.Charge" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.plinius.Charge" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
