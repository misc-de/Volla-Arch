# Satellite networks that reach ordinary LTE phones (plinius-satellite).
#
# One group per service. A network counts as a satellite when the PLMN (MCC + MNC) it is
# registered on is in Plmn=, or else when its name matches a pattern in NetworkName= (glob,
# case does not matter). Services= says what works there: sms, mms, data, voice, emergency.
#
# Local additions and corrections go to /etc/plinius-satellite/providers.d/*.conf: a group of
# the same name replaces the entry here, Disabled=true switches it off.
#
# The Plinius modem (MT6878) has no 3GPP NTN, so only services that send plain LTE from space
# work, and only in its LTE bands (1 2 3 5 7 8 9 18 19 20 28 34 38 40 41 42 43, AT+EPBSE).
# Whether a provider lets a phone in also depends on its device list.

[T-Mobile US]
# T-Satellite (Starlink), band 25 (PCS G block): not one of the Plinius bands, kept so that
# the entry is right should a phone with band 25 use this. PLMN from AOSP CarrierConfig
# carrier_config_carrierid_1_T-Mobile-US.xml (310830: SMS, MMS); apps with data since 10/2025.
Name=T-Mobile T-Satellite
Plmn=310830
NetworkName=T-Mobile SpaceX*;T-Sat*
Services=sms;mms;data

[O2 UK]
# O2 Satellite (Starlink) since 26.02.2026, 5 MHz in band 3, texts and app data
Name=O2 Satellite
NetworkName=O2 Satellite*;O2 - Satellite*
Services=sms;data

[Kyivstar]
# Kyivstar-SpaceX (Starlink) since 11/2025, texts, light data since 06/2026
Name=Kyivstar Satellite
NetworkName=Kyivstar*SpaceX*
Services=sms;data

[Starlink]
# Other Starlink Direct to Cell partners (One NZ, Optus, Telstra, Rogers, Entel, KDDI, ...)
# show a name with SpaceX or Starlink in it. Texts are the common ground.
Name=Starlink
NetworkName=*SpaceX*;*Starlink*
Services=sms
