# plinius-satellite: what happens while the phone is connected through a satellite
[Policy]
# The mobile connection counts as metered, apps that care hold back updates and backups.
# Only the active connection changes, the saved profile stays as it is.
Metered=true
# Roaming data is allowed while on a satellite that offers data, and switched off again
# afterwards. A satellite of the own operator often shows as roaming.
DataRoaming=true
# Seconds the satellite stays "active" after the registration is lost (passing satellites)
Hysteresis=60
