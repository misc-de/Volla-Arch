<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- plinius-satellite: only root owns the name. Anyone may read its properties and call Scan;
     the service itself only lets root or the user of the unlocked phone scan. -->
<busconfig>
  <policy user="root">
    <allow own="org.plinius.Satellite"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.plinius.Satellite" send_interface="org.plinius.Satellite"/>
    <allow send_destination="org.plinius.Satellite" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.plinius.Satellite" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.plinius.Satellite" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
