<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- plinius-mce: only root owns the name and sets the display state (org.plinius.Mce, from the
     hook of plinius-backlight-wake). Anyone may read the states. -->
<busconfig>
  <policy user="root">
    <allow own="com.nokia.mce"/>
    <allow send_destination="com.nokia.mce" send_interface="org.plinius.Mce"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.nokia.mce" send_interface="com.nokia.mce.request"/>
    <allow send_destination="com.nokia.mce" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.nokia.mce" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
