<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- eSIM management (lpac) as the phone's user: members of "radio" may find the modems and
     use oFono's ISD-R channels. The interface itself only accepts ISD-R AIDs. -->
<busconfig>
  <policy group="radio">
    <allow send_destination="org.ofono" send_interface="org.ofono.Manager" send_member="GetModems"/>
    <allow send_destination="org.ofono" send_interface="org.plinius.ofono.EuiccChannel"/>
  </policy>
</busconfig>
