# coverage.py settings of tools/run-tests.sh --coverage. The programs the tests start as their own
# process (python3 -I boot-image ..., the CLI tools) are measured too: patch = subprocess hands
# this configuration to every Python started below pytest, each writes its own data file
# (parallel), and run-tests.sh combines them before the report.
[run]
branch = True
source =
    pkgbuilds
    tools
parallel = True
patch = subprocess
# Phone-only programs, not measured (each needs what only the phone has):
omit =
    # Wi-Fi calling probe: talks to the RIL's binder services through libgbinder at import time
    */tools/mwi-probe.py
    # AT commands through atcid's socket inside the running Android container (lxc-info)
    */tools/modem-at.py
    # End-to-end run of the installed mmsd4ofono (/usr/bin/mmsd, /usr/lib/mmsd, aiohttp) against
    # stand-ins, with mmsd's real 45 s linger; run by hand on the phone
    */tools/mms-standin.py
