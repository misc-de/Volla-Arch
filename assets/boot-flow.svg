<svg xmlns="http://www.w3.org/2000/svg" width="720" height="886" viewBox="0 0 720 886" role="img" aria-label="Boot flow: the bootloader loads kernel and Halium ramdisk from the active slot of the internal storage, the ramdisk mounts the Arch rootfs from a file on the data partition and the Android image and starts systemd, which starts the USB functions, bootcheck and the Android container, then phoc, Phosh and apps."><style>
svg { --fg:#19202b; --muted:#586274; --line:#c3cbd7; --surface:#ffffff; --band0:#eef1f6; --band1:#f7f9fc;
  --own:#1b78c0; --own-bg:#e3effa; --vendor:#b0600e; --vendor-bg:#fbeedd; --kern:#4c5869; --kern-bg:#e6e9ef; --warn:#c0392b; }
@media (prefers-color-scheme: dark) { svg { --fg:#e3e8ef; --muted:#9aa5b5; --line:#3a4453; --surface:#19202a;
  --band0:#161b23; --band1:#12161d; --own:#62b1ee; --own-bg:#14304a; --vendor:#e9a45c; --vendor-bg:#3a2815;
  --kern:#aab5c5; --kern-bg:#232a35; --warn:#ff7b6e; } }
text { fill:var(--fg); font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif; font-size:12px; }
.bg { fill:var(--surface); }
.band { fill:var(--band0); } .band.alt { fill:var(--band1); }
.box rect { fill:var(--surface); stroke:var(--line); stroke-width:1.2; }
.box.own rect { fill:var(--own-bg); stroke:var(--own); }
.box.vendor rect { fill:var(--vendor-bg); stroke:var(--vendor); }
.box.kern rect { fill:var(--kern-bg); stroke:var(--kern); }
.box.hw rect { fill:none; stroke:var(--muted); }
.box.plan rect { stroke-dasharray:5 4; stroke-width:1.4; }
.box.other rect { fill:none; stroke-dasharray:3 3; }
.box.other text { fill:var(--muted); font-weight:400; font-size:11.5px; }
.t { font-weight:600; font-size:13px; } .s { font-size:11.5px; fill:var(--muted); }
.mono, .ps { font-family:"IBM Plex Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace; }
.mono { font-size:11px; }
.pn { font-weight:600; font-size:14px; } .pn.sm { font-size:12.5px; }
.ps { font-size:10.5px; fill:var(--muted); }
.ch { font-weight:600; font-size:12.5px; }
.c { font-size:11.5px; } .c.sub { fill:var(--muted); font-size:10.5px; }
.lbl { font-size:11px; fill:var(--muted); } .lbl.warnt { fill:var(--warn); }
.ar { stroke:var(--fg); stroke-width:1.4; fill:none; } .ar.dim { stroke:var(--muted); } .ar.dash { stroke-dasharray:4 3; }
.ar.warn { stroke:var(--warn); stroke-dasharray:5 4; }
.mk { fill:var(--fg); } .mkw { fill:var(--warn); } .mkd { fill:var(--muted); }
.pill { fill:var(--surface); } .ghl { stroke:var(--line); stroke-width:1; }
.lg { font-size:11.5px; fill:var(--muted); } .ln { stroke:var(--muted); stroke-width:1.4; }
</style><rect class="bg" width="720" height="886" rx="8"/><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a1w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkw" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a1d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkd" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="band" x="0" y="0" width="720" height="176"/><text class="pn" x="14" y="28" text-anchor="start">Bootloader</text><text class="ps" x="14" y="45" text-anchor="start">lk + ABM</text><rect class="band alt" x="0" y="176" width="720" height="314"/><text class="pn" x="14" y="204" text-anchor="start">Ramdisk</text><text class="ps" x="14" y="221" text-anchor="start">initrd from UT</text><rect class="band" x="0" y="490" width="720" height="256"/><text class="pn" x="14" y="518" text-anchor="start">systemd</text><text class="ps" x="14" y="535" text-anchor="start">Arch rootfs</text><rect class="band alt" x="0" y="746" width="720" height="100"/><text class="pn" x="14" y="774" text-anchor="start">Session</text><text class="ps" x="14" y="791" text-anchor="start">Phosh</text><g class="box "><rect x="148" y="20" width="360" height="50" rx="6"/><text class="t" x="160" y="41">lk + ABM boot menu</text><text class="s" x="160" y="58">Bootloader (unlocked) · menu only with an SD card</text></g><g class="box other"><rect x="540" y="32" width="168" height="26" rx="6"/><text class="t" x="552" y="49.5">Other systems · SD</text></g><line class="ar dim" x1="508" y1="45" x2="538" y2="45" marker-end="url(#a1d)"/><line class="ar " x1="328" y1="70" x2="328" y2="94" marker-end="url(#a1)"/><text class="lbl" x="338" y="87" text-anchor="start">active slot</text><g class="box kern"><rect x="148" y="96" width="560" height="62" rx="6"/><text class="t" x="160" y="117">Kernel + ramdisk from the active slot (internal storage)</text><text class="s" x="160" y="134">boot: GKI kernel 6.1, taken from Ubuntu Touch</text><text class="s" x="160" y="149">vendor_boot + init_boot: MTK modules + Halium ramdisk</text></g><line class="ar " x1="328" y1="158" x2="328" y2="194" marker-end="url(#a1)"/><text class="lbl mono" x="338" y="182" text-anchor="start">cmdline: no systempart=</text><g class="box "><rect x="148" y="196" width="360" height="50" rx="6"/><text class="t" x="160" y="217">Resolve Android partitions</text><text class="s" x="160" y="234">super → dmsetup → system, vendor, …</text></g><line class="ar " x1="328" y1="246" x2="328" y2="266" marker-end="url(#a1)"/><g class="box own plan"><rect x="148" y="268" width="360" height="62" rx="6"/><text class="t" x="160" y="289">Unlock LUKS (if encrypted)</text><text class="s" x="160" y="306">plinius-crypt · password via unl0kr</text><text class="s" x="160" y="321">planned: needs its own init_boot</text></g><g class="box own plan"><rect x="540" y="268" width="168" height="62" rx="6"/><text class="t" x="552" y="289">Encryption requested</text><text class="s" x="552" y="306">→ encrypt offline</text><text class="s mono" x="552" y="321">plinius-progress</text></g><line class="ar dash" x1="508" y1="299" x2="538" y2="299" marker-end="url(#a1)"/><line class="ar " x1="328" y1="330" x2="328" y2="350" marker-end="url(#a1)"/><g class="box "><rect x="148" y="352" width="560" height="62" rx="6"/><text class="t" x="160" y="373">Mount filesystems</text><text class="s mono" x="160" y="390">userdata → /userdata     rootfs.img → /</text><text class="s" x="160" y="405">android-rootfs.img → /android · / stays writable (/.writable_image)</text></g><line class="ar " x1="328" y1="414" x2="328" y2="434" marker-end="url(#a1)"/><g class="box "><rect x="148" y="436" width="360" height="36" rx="6"/><text class="t" x="160" y="458.5">exec /sbin/init  →  systemd</text></g><line class="ar" x1="328" y1="472" x2="328" y2="500"/><line class="ar" x1="236" y1="500" x2="620" y2="500"/><line class="ar " x1="236" y1="500" x2="236" y2="520" marker-end="url(#a1)"/><line class="ar " x1="428" y1="500" x2="428" y2="520" marker-end="url(#a1)"/><line class="ar " x1="620" y1="500" x2="620" y2="520" marker-end="url(#a1)"/><g class="box own"><rect x="148" y="522" width="176" height="50" rx="6"/><text class="t" x="160" y="543">USB functions</text><text class="s mono" x="160" y="560">plinius-usb</text></g><line class="ar " x1="236" y1="572" x2="236" y2="590" marker-end="url(#a1)"/><g class="box "><rect x="148" y="592" width="176" height="50" rx="6"/><text class="t" x="160" y="613">sshd</text><text class="s" x="160" y="630">SSH over USB, recovery path</text></g><g class="box own"><rect x="340" y="522" width="176" height="64" rx="6"/><text class="t" x="352" y="543">plinius-bootcheck</text><text class="s" x="352" y="560">SHA-256 of lk, boot,</text><text class="s" x="352" y="575">init_boot … vs. reference</text></g><g class="box vendor"><rect x="532" y="522" width="176" height="50" rx="6"/><text class="t" x="544" y="543">Android container</text><text class="s" x="544" y="560">LXC · Android-init</text></g><line class="ar " x1="620" y1="572" x2="620" y2="590" marker-end="url(#a1)"/><g class="box vendor"><rect x="532" y="592" width="176" height="50" rx="6"/><text class="t" x="544" y="613">Vendor HALs</text><text class="s" x="544" y="630">Radio, GNSS, BT, Audio …</text></g><line class="ar " x1="620" y1="642" x2="620" y2="660" marker-end="url(#a1)"/><text class="lbl" x="628" y="655" text-anchor="start">Binder</text><g class="box own"><rect x="532" y="662" width="176" height="64" rx="6"/><text class="t" x="544" y="683">Bridge services</text><text class="s" x="544" y="700">ofono, bluebinder, biomd,</text><text class="s" x="544" y="715">gnss-nmea-bridge, nfcd</text></g><line class="ar warn" x1="428" y1="586" x2="428" y2="770" marker-end="url(#a1w)"/><text class="lbl warnt" x="436" y="680" text-anchor="start">Warning</text><text class="lbl warnt" x="436" y="694" text-anchor="start">if changed</text><line class="ar " x1="620" y1="726" x2="620" y2="770" marker-end="url(#a1)"/><text class="lbl" x="628" y="754" text-anchor="start">D-Bus</text><g class="box own"><rect x="148" y="772" width="176" height="50" rx="6"/><text class="t" x="160" y="793">phoc</text><text class="s" x="160" y="810">GPU via hybris-gbm, KMS</text></g><line class="ar " x1="324" y1="797" x2="338" y2="797" marker-end="url(#a1)"/><g class="box "><rect x="340" y="772" width="176" height="50" rx="6"/><text class="t" x="352" y="793">Phosh</text><text class="s" x="352" y="810">Lock screen, PIN</text></g><line class="ar " x1="516" y1="797" x2="530" y2="797" marker-end="url(#a1)"/><g class="box "><rect x="532" y="772" width="176" height="50" rx="6"/><text class="t" x="544" y="793">Apps</text><text class="s" x="544" y="810">Calls, SMS, Software …</text></g><line class="ghl" x1="0" y1="846.5" x2="720" y2="846.5"/><g class="box "><rect x="14" y="860" width="18" height="12" rx="3"/></g><text class="lg" x="39" y="870">Arch Linux ARM</text><g class="box own"><rect x="142.0" y="860" width="18" height="12" rx="3"/></g><text class="lg" x="167.0" y="870">own package</text><g class="box vendor"><rect x="252.0" y="860" width="18" height="12" rx="3"/></g><text class="lg" x="277.0" y="870">Android vendor (Volla)</text><g class="box kern"><rect x="428.0" y="860" width="18" height="12" rx="3"/></g><text class="lg" x="453.0" y="870">Ubuntu Touch kernel</text><g class="box own plan"><rect x="586.0" y="860" width="18" height="12" rx="3"/></g><text class="lg" x="611.0" y="870">planned or open</text></svg>
